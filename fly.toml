# Fly.io — free-tier deploy (fetch crawler, no Playwright).
# Docs: docs/development/cloud-hosting-free.md

app = 'lso-optimizer'
primary_region = 'iad'

[build]
  dockerfile = 'infrastructure/docker/cloud-lite.Dockerfile'

[env]
  NODE_ENV = 'production'
  LOG_LEVEL = 'info'
  AI_ENABLED = 'false'
  REPORT_DIRECTORY = '/data/reports'
  CRAWLER_ALLOW_LOCALHOST = 'false'
  CRAWLER_ENGINE = 'fetch'
  CRAWLER_MAX_PAGES = '30'
  CRAWLER_MAX_DEPTH = '2'
  CRAWLER_CONCURRENCY = '2'
  API_PORT = '3001'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = 'lso_reports'
  destination = '/data/reports'
