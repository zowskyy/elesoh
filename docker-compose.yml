services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lso
      POSTGRES_PASSWORD: lso
      POSTGRES_DB: lso
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lso -d lso"]
      interval: 3s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
