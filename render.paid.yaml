# Cloud hosting (paid Render — optional)

Render’s free tier cannot run Playwright workers. This blueprint requires **Standard** (~$25/mo).

For **$0 hosting**, use [cloud-hosting-free.md](./cloud-hosting-free.md) (Fly.io + Neon + Upstash, or Oracle Cloud).

---

# Render blueprint (paid)

databases:
  - name: lso-db
    plan: free
    databaseName: lso
    user: lso

services:
  - type: redis
    name: lso-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: lso-optimizer-api
    runtime: docker
    plan: standard
    region: oregon
    dockerfilePath: ./infrastructure/docker/cloud.Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    disk:
      name: lso-reports
      mountPath: /app/reports
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lso-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: lso-redis
          property: connectionString
      - key: API_PORT
        value: "3001"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: AI_ENABLED
        value: "false"
      - key: REPORT_DIRECTORY
        value: /app/reports
      - key: CRAWLER_ALLOW_LOCALHOST
        value: "false"
      - key: CRAWLER_MAX_PAGES
        value: "50"
