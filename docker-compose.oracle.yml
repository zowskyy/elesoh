# Oracle Cloud Always Free — single VM stack (full Playwright).
# Usage on the VM:
#   export POSTGRES_PASSWORD='your-strong-password'
#   docker compose -f docker-compose.oracle.yml up -d --build

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: lso
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: lso
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lso -d lso']
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
      dockerfile: infrastructure/docker/cloud.Dockerfile
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgres://lso:${POSTGRES_PASSWORD}@postgres:5432/lso
      REDIS_URL: redis://redis:6379/0
      API_PORT: '3001'
      LOG_LEVEL: info
      NODE_ENV: production
      AI_ENABLED: 'false'
      REPORT_DIRECTORY: /app/reports
      CRAWLER_ALLOW_LOCALHOST: 'false'
      CRAWLER_ENGINE: playwright
      CRAWLER_MAX_PAGES: '50'
      CRAWLER_MAX_DEPTH: '3'
      CRAWLER_CONCURRENCY: '2'
    volumes:
      - reports_data:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"fetch('http://127.0.0.1:3001/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 120s

volumes:
  postgres_data:
  reports_data:
